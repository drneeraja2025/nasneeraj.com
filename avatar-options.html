<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Girl avatar options — Saaniya mascot</title>
  <style>
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: #f3efe6; color: #1c1917; }
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 0.35rem; }
    p { margin: 0 0 1.75rem; color: #57534e; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; }
    figure { margin: 0; background: #fffaf3; border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 28px rgba(28,25,23,0.08); }
    img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    figcaption { padding: 0.85rem 1rem 1.1rem; font-size: 0.95rem; line-height: 1.35; }
    strong { display: block; font-size: 1.05rem; margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>8 girl avatar options</h1>
    <p>Candidates to replace the Pause pebble. Pick a number (or mix style + character).</p>
    <div class="grid">
      <figure>
        <img src="assets/mascot/avatars/avatar-01-saffron.png" alt="Option 1">
        <figcaption><strong>1 — Saffron</strong> Warm illustrated portrait, scarf accent, company/home feel.</figcaption>
      </figure>
      <figure>
        <img src="assets/mascot/avatars/avatar-02-clay-green.png" alt="Option 2">
        <figcaption><strong>2 — Clay green</strong> Soft 3D clay girl, closest material language to Pause.</figcaption>
      </figure>
      <figure>
        <img src="assets/mascot/avatars/avatar-03-navy-pro.png" alt="Option 3">
        <figcaption><strong>3 — Navy pro</strong> Flat vector professional, strong for EMR / desk products.</figcaption>
      </figure>
      <figure>
        <img src="assets/mascot/avatars/avatar-04-indigo-lens.png" alt="Option 4">
        <figcaption><strong>4 — Indigo lens</strong> Quiet “moment” mood, glasses, watercolor-digital.</figcaption>
      </figure>
      <figure>
        <img src="assets/mascot/avatars/avatar-05-teacher-warm.png" alt="Option 5">
        <figcaption><strong>5 — Teacher warm</strong> School / GuruVidyaZen / SISLMS friendly.</figcaption>
      </figure>
      <figure>
        <img src="assets/mascot/avatars/avatar-06-clinic-teal.png" alt="Option 6">
        <figcaption><strong>6 — Clinic teal</strong> Calm clinic tone for Saaniya EMR.</figcaption>
      </figure>
      <figure>
        <img src="assets/mascot/avatars/avatar-07-logo-geo.png" alt="Option 7">
        <figcaption><strong>7 — Logo geo</strong> Bold geometric mark; works small (favicon / nav).</figcaption>
      </figure>
      <figure>
        <img src="assets/mascot/avatars/avatar-08-moment-dusk.png" alt="Option 8">
        <figcaption><strong>8 — Moment dusk</strong> Poetic “Saaniya = moment” silhouette-portrait.</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
